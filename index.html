<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>growi-plugin-react-table - mock</title>
    <!-- GROWI 7/8 ships Bootstrap 5; the plugin styles assume its variables and utilities. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body {
        padding: 2rem;
        max-width: 60rem;
      }
      h2 {
        margin-top: 2.5rem;
        font-size: 1rem;
        color: #6c757d;
      }
    </style>
  </head>
  <body>
    <h1>growi-plugin-react-table</h1>

    <h2>basic</h2>
    <div id="mock-basic"></div>

    <h2>rich cells</h2>
    <div id="mock-rich-cell"></div>

    <h2>too small to enhance</h2>
    <div id="mock-tiny"></div>

    <h2>no header row</h2>
    <div id="mock-headerless"></div>

    <h2>calculation notation</h2>
    <div id="mock-calc"></div>

    <h2>calculation with nothing to aggregate</h2>
    <div id="mock-calc-error"></div>

    <h2>calculation next to markup</h2>
    <div id="mock-calc-markup"></div>

    <h2>wide table</h2>
    <div id="mock-wide"></div>

    <h2>long table</h2>
    <div id="mock-long"></div>

    <h2>numeric column</h2>
    <div id="mock-numeric"></div>

    <script type="module" src="/src/mock/index-page.tsx"></script>
  </body>
</html>
