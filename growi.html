<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>growi-plugin-react-table - GROWI table with edit button</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      /*
       * Copied from GROWI's
       * apps/app/src/client/components/ReactMarkdownComponents/TableWithEditButton.module.scss
       *
       * The important part is that the edit button has NO z-index. That is what made it
       * disappear behind DataTables' container in growi-plugin-datatables, so adding one
       * here would hide the very bug this page exists to catch.
       *
       * Keep in sync with GROWI's component.
       */
      .editable-with-handsontable {
        position: relative;
      }

      .editable-with-handsontable .handsontable-modal-trigger {
        position: absolute;
        top: 8px;
        right: 10px;
        padding: 0;
        font-size: 16px;
        line-height: 1;
        vertical-align: bottom;
        background-color: transparent;
        border: none;
        opacity: 0;
      }

      .editable-with-handsontable:hover .handsontable-modal-trigger {
        opacity: 1;
      }

      /*
       * The real button holds one Material Symbols glyph, 16px square. A box of the same
       * size stands in for it: the hit area is what these tests measure, and depending on
       * a CDN font would make that size depend on the network.
       */
      .material-symbols-outlined {
        display: inline-block;
        width: 16px;
        height: 16px;
        background: currentColor;
      }

      body {
        padding: 2rem;
        max-width: 60rem;
      }

      h2 {
        margin-top: 2.5rem;
        font-size: 1rem;
        color: #6c757d;
      }
    </style>
  </head>
  <body>
    <h1>growi-plugin-react-table &mdash; GROWI view renderer</h1>

    <h2>table with edit button</h2>
    <div id="mock-growi-basic"></div>

    <h2>wide table with edit button</h2>
    <div id="mock-growi-wide"></div>

    <script type="module" src="/src/mock/growi-page.tsx"></script>
  </body>
</html>
